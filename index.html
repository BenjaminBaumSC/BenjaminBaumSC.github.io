<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Benjamin Baum</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
</head>
<body>
  <main id="scene">
    <div class="label">FIG. 2 — SPIELFELD, SCHNITT A–A</div>
    <div id="fields"></div>
    <div id="floor"></div>
    <div class="title-block">
      <div>PROJ: BENJAMINBAUMSC</div>
      <div>DWG: THE CAKE IS A LIE</div>
      <div id="rev">REV: 0.1 · BL. 1/1</div>
      <div>PKT: <span id="score">0</span></div>
    </div>
    <div class="controls">
      <button id="clear-row" type="button">LEISTE SPRENGEN</button>
      <button id="restart" type="button">NEU ZEICHNEN</button>
    </div>
    <canvas id="tiles"></canvas>
    <div id="fx"></div>
    <div id="reward"></div>
  </main>

  <div id="rotate-hint">
    <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
      <g class="phone">
        <rect x="40" y="20" width="40" height="76" rx="6" />
        <line x1="54" y1="88" x2="66" y2="88" />
      </g>
      <path d="M 96 40 A 44 44 0 0 1 96 80" />
      <path d="M 90 76 L 96 82 L 102 75" />
    </svg>
    <div>FIG. 3 — BITTE DREHEN</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
